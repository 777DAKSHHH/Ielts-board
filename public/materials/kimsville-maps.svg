      <path d="M-55,30 L-55,-5 A16,16 0 0,1 -23,-5 L-23,30 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
      <path d="M-16,30 L-16,-12 A16,16 0 0,1 16,-12 L16,30 Z" fill="#F59E0B" stroke="#B45309" stroke-width="2"/>
