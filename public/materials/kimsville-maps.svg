      <line x1="0" y1="-24" x2="0" y2="-28" stroke="#0F172A" stroke-width="1.5"/>
      <line x1="0" y1="-24" x2="3" y2="-24" stroke="#0F172A" stroke-width="1.5"/>

      <line x1="-120" y1="20" x2="-70" y2="20" stroke="#475569" stroke-width="3"/>
      <line x1="-120" y1="30" x2="-70" y2="30" stroke="#475569" stroke-width="3"/>
      <line x1="-115" y1="16" x2="-115" y2="34" stroke="#64748B" stroke-width="2"/>
      <line x1="-100" y1="16" x2="-100" y2="34" stroke="#64748B" stroke-width="2"/>
      <line x1="-85" y1="16" x2="-85" y2="34" stroke="#64748B" stroke-width="2"/>

