    <text x="38" y="56" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="24" font-weight="800" fill="#FFFFFF" letter-spacing="0.5">Kimsville, today</text>

    <!-- ================= CITY CENTRE (TODAY) - CONSTANT ANCHOR === -->
    <rect x="340" y="190" width="120" height="230" fill="#E2E8F0" opacity="0.6" rx="4"/>
    <rect x="340" y="800" width="120" height="200" fill="#E2E8F0" opacity="0.6" rx="4"/>
    <rect x="180" y="580" width="120" height="80" fill="#E2E8F0" opacity="0.6" rx="4"/>
    <rect x="490" y="520" width="130" height="80" fill="#E2E8F0" opacity="0.6" rx="4"/>

    <!-- City Centre Rectangle (Identical Preserved Anchor) -->
