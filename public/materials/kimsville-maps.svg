    <text x="400" y="605" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">city</text>
    <text x="400" y="640" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="28" font-weight="800" fill="#0F172A" text-anchor="middle" letter-spacing="0.5">centre</text>

    <!-- ================= TOP-LEFT CORNER: NEW APARTMENTS (TODAY) == -->
