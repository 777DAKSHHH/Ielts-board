      <rect x="-32" y="-62" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-8" y="-62" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="16" y="-62" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-32" y="-45" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-8" y="-45" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="16" y="-45" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-32" y="-28" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-8" y="-28" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="16" y="-28" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-32" y="-11" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-8" y="-11" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="16" y="-11" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-32" y="6" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-8" y="6" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="16" y="6" width="16" height="11" rx="1" fill="#93C5FD"/>
      <rect x="-14" y="26" width="28" height="24" rx="2" fill="#0284C7" stroke="#0369A1" stroke-width="1.5"/>

      <text x="0" y="78" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Roboto, sans-serif" font-size="22" font-weight="800" fill="#0F172A" text-anchor="middle">new apartments</text>
    </g>

    <!-- ================= TOP-RIGHT CORNER: TREES (PRESERVED) ====== -->
    <g transform="translate(650, 160)">
